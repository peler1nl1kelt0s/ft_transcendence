<svg id="backGroundColor"></svg>
<!-- SAĞ VE SOL PANELİ BİRBİRİNDEN AYIR -->
<div class="centering-element">
    <!-- SOL PANEL -->
    <div class="left-panel row d-flex justify-content-evenly">
        <!-- TAB BAR -->
        <nav class="nav d-flex justify-content-evenly align-items-center">
            <a id="homeBTN" href="" class="nav-item is-active" data-target-path="/home" active-color="orange" data-lang="homeBTN">Home</a>
            <a id="leaderboardBTN" href="" class="nav-item" data-target-path="/leaderboard" active-color="green" data-lang="leaderboardBTN">Leaderboard</a>
            <a id="statisticsBTN" href="" class="nav-item" data-target-path="/statistics" active-color="blue" data-lang="statisticsBTN">Statistics</a>
            <a id="friendsBTN" href="" class="nav-item" data-target-path="/friends" active-color="red" data-lang="friendsBTN">Friends</a>
            <a id="profileBTN" href="" class="nav-item" data-target-path="/profile" active-color="rebeccapurple" data-lang="profileBTN">Profile</a>
            <input id="findFriendSearch" class="findFriendSearch" data-lang="findFriendSearch" placeholder="Search User">
            <span class="nav-indicator"></span>
            <select id="language-selector">
                <option value="en"> En </option>
                <option value="de"> De </option>
                <option value="tr"> Tr </option>
            </select>
        </nav>

        <!-- DEGISECEK ALAN -->
        <div id="content" class="content rounded fade-in"></div>
    </div>

    <!-- SAĞ PANEL -->
    <div class="right-panel row d-flex justify-content-evenly">
        <div class="card card-stats">
            <div class="card-body">
                <div class="row">
                <div class="col" style="width: 8vw;">
                    <div class="row" style="width: 7vw;">
                        <h5 class="card-title text-uppercase" id="panel-username"></h5>
                    </div>
                    <div class="row score-rank-group" style="width: 7vw;">
                        <div class="score">
                            <span id="score" data-lang="score" class="h5 font-weight-bold mb-0" style="color: #5f5d59;">Score:</span>
                            <span class="h5 font-weight-bold mb-0" id="score-number"></span>
                        </div>
                    </div>
                </div>
                <div class="col right-card-col">
                <div class="icon icon-shape text-white rounded-circle shadow">
                    <img src="" alt="intra-image" class="card-image" id="panel-pic">
                </div>
                </div>
                </div>
            </div>
        </div>
        <!-- CHAT -->

        <div class="chat-panel">

            <div class="match-chat-container user-select-none">
                <div class="match-general-chat-btn text-white p-2 rounded user-select-none" data-bs-toggle="dropdown" aria-expanded="false">
                  <div class="col justify-content-start d-flex align-items-center" style="text-align: start;">
                    <div class="dropdown-arrow">
                      <i class="fi fi-br-caret-left"></i>
                    </div>
                    <img src="/img/world.png" class="chat-img-general shadow me-2" alt="Profile Image">
                    <div id="chat-name" class="dropdown-chat-name" data-lang="chat-name">
                      General Chat
                    </div>
                  </div>
                </div>
                <ul class="dropdown-menu match-dropdown-menu" id="chat-list">
                </ul>
              </div>

            <div class="chat-container">
                <div id="chat-scroll" class="chat-scroll">
                    <div class="chat-log text-white" id="chat-log">
                <!-- İÇERİK -->
                    </div>
                    </div>
                <div class="input-container">
                        <input maxlength="35" rows="1" data-lang="message-input" id="message-input" placeholder="Message..." rows="1">
                        <button id="send-button" class="cool-btn" data-lang="send-button">Send</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- POPUP MODAL -->
<div class="modal fade friend-modal" id="friendInfoModal" tabindex="-1" aria-labelledby="friendInfoModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content"  id="modalContent">
         <!-- Content -->
      </div>
    </div>
</div>
