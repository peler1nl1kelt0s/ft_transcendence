<div class="play-with-friends-container">
  <div class="player" id="player">
      <div class="profile-pic" id="player1-pic"></div>
      <div class="content" id="content">
          <div class="username" id="player1-username">Player is not found</div>
          <div data-lang="game-room-status" class="status" id="status">Waiting</div>
      </div>
  </div>
  <div class="enemy" id="enemy">
      <div class="profile-pic" id="player2-pic"></div>
      <div class="content" id="content">
          <div class="username" id="player2-username">Enemy is not found</div>
          <div data-lang="game-room-status-ifonline" class="status" id="status">Waiting</div>
      </div>
  </div>
  <div class="popup">
    <div class="vs">VS</div>
    <button class="start-button cool-btn" data-lang="game-room-status-start-button" id="start-button" onclick="startButtonClicked()">Start Game!</button>
  </div>
</div>
